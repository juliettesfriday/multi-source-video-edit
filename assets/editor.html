<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕校对</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171522;color:#eee;font:15px/1.5 system-ui,sans-serif}header{padding:20px 24px;border-bottom:1px solid #494157}h1{margin:0;font-size:22px}p{color:#bdb6ce}button,.file{font:inherit;color:inherit;background:#342b48;border:1px solid #675780;border-radius:7px;padding:8px 12px;cursor:pointer}input,textarea{font:inherit;color:inherit;background:#211c2d;border:1px solid #675780;border-radius:6px;padding:7px}input[type=file]{display:none}.toolbar{display:flex;flex-wrap:wrap;gap:8px}main{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:24px}.viewer{position:sticky;top:16px;align-self:start}video{width:100%;display:block;background:#000}.caption{white-space:pre-line;min-height:80px;text-align:center;padding:15px;font-size:25px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#seek,#search{width:100%}#list{max-height:70vh;overflow:auto;margin-top:12px}.row{padding:12px;border:1px solid #494157;border-radius:7px;margin:8px 0}.row.active{border-color:#bea4ef}.times{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.times input{width:120px}.row textarea{width:100%;min-height:62px;margin-top:8px}#error{color:#ffb7a7}small{color:#bdb6ce}@media(max-width:900px){main{display:block}.viewer{position:static}#list{max-height:55vh}}</style>
<header><h1>字幕校对</h1><p>选择同时间轴的无字幕底片或校对代理。此处字幕用于校对，最终字号与进度条以导出预览为准。</p><div class="toolbar"><label class="file">选择视频<input id="videoFile" type="file" accept="video/*"></label><label class="file">导入 SRT<input id="srtFile" type="file" accept=".srt"></label><button id="export">导出修改后的 SRT</button><button id="restore">恢复草稿</button><button id="reset">恢复初始字幕</button></div><p id="status"></p><div id="error"></div></header>
<main><section class="viewer"><video id="video" preload="metadata" __VIDEO__></video><div id="caption" class="caption"></div><div class="controls"><button id="play">播放 / 暂停</button><button id="back">后退3秒</button><button id="next">前进3秒</button><button id="locate">定位当前字幕</button><label><input id="loop" type="checkbox">循环当前句</label><span id="time"></span></div><input id="seek" type="range" min="0" step=".001" value="0"><small>删字幕只取消文字，不会剪掉视频。浏览器草稿不代替保存，请导出 SRT。</small></section><section><input id="search" placeholder="搜索文字或编号"><div id="list"></div></section></main>
<script>
const INITIAL=__CUES__,DRAFT=__DRAFT__;let cues=structuredClone(INITIAL),active=-1,loopId=null,objectUrl=null;
const $=s=>document.querySelector(s),video=$('#video');
function stamp(n){return `${String(Math.floor(n/3600000)).padStart(2,'0')}:${String(Math.floor(n/60000)%60).padStart(2,'0')}:${String(Math.floor(n/1000)%60).padStart(2,'0')},${String(n%1000).padStart(3,'0')}`}
function parseTime(s){const m=s.trim().match(/^(\d+):(\d{2}):(\d{2})[,.](\d{3})$/);if(!m||+m[2]>=60||+m[3]>=60)throw Error('时间格式应为00:00:00,000');return ((+m[1]*60+ +m[2])*60+ +m[3])*1000+ +m[4]}
function validate(items){let end=0;for(let i=0;i<items.length;i++){const c=items[i];if(!Number.isInteger(c.start)||!Number.isInteger(c.end)||c.start<end||c.end<=c.start||!c.text.trim())throw Error(`第${i+1}条时间重叠、不合法或文字为空`);if(Number.isFinite(video.duration)&&c.end>video.duration*1000+100)throw Error(`第${i+1}条超出视频时长`);end=c.end}return items}
function save(){try{localStorage.setItem(DRAFT,JSON.stringify(cues))}catch{}$('#status').textContent=`${cues.length}条字幕 · 请导出SRT正式保存`;try{validate(cues);$('#error').textContent=''}catch(e){$('#error').textContent=e.message}}
function safePlay(){video.play().catch(e=>$('#error').textContent='请先选择可播放的视频：'+e.message)}
function render(){const list=$('#list');list.replaceChildren();const q=$('#search').value.trim().toLowerCase();cues.forEach((c,i)=>{if(q&&!c.text.toLowerCase().includes(q)&&String(i+1)!==q)return;const row=document.createElement('div');row.className='row';row.id='cue-'+i;const times=document.createElement('div');times.className='times';const n=document.createElement('span');n.textContent=i+1;times.append(n);for(const key of ['start','end']){const input=document.createElement('input');input.value=stamp(c[key]);input.title=key;input.onchange=()=>{try{c[key]=parseTime(input.value);save()}catch(e){$('#error').textContent=e.message;input.value=stamp(c[key])}};times.append(input)}const play=document.createElement('button');play.textContent='试听';play.onclick=()=>{loopId=i;video.currentTime=c.start/1000;safePlay()};const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{cues.splice(i,1);loopId=null;save();render()};times.append(play,del);const area=document.createElement('textarea');area.value=c.text;area.oninput=()=>{c.text=area.value;save()};row.append(times,area);list.append(row)});active=-1}
function update(){const t=Math.round((video.currentTime||0)*1000);const i=cues.findIndex(c=>c.start<=t&&t<c.end);$('#caption').textContent=i>=0?cues[i].text:'';$('#time').textContent=stamp(t);$('#seek').value=t/1000;if(i!==active){$('.row.active')?.classList.remove('active');$('#cue-'+i)?.classList.add('active');active=i}if($('#loop').checked&&loopId!==null&&cues[loopId]&&t>=cues[loopId].end)video.currentTime=cues[loopId].start/1000;requestAnimationFrame(update)}
$('#play').onclick=()=>video.paused?safePlay():video.pause();$('#back').onclick=()=>video.currentTime=Math.max(0,video.currentTime-3);$('#next').onclick=()=>video.currentTime=Math.min(video.duration||0,video.currentTime+3);$('#locate').onclick=()=>$('#cue-'+active)?.scrollIntoView({block:'center'});$('#seek').oninput=e=>video.currentTime=+e.target.value;$('#search').oninput=render;
video.onloadedmetadata=()=>{$('#seek').max=video.duration;try{validate(cues);$('#error').textContent=''}catch(e){$('#error').textContent=e.message}};
$('#videoFile').onchange=e=>{if(e.target.files[0]){if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(e.target.files[0]);video.src=objectUrl}};
$('#srtFile').onchange=async e=>{try{if(!e.target.files[0])return;const text=(await e.target.files[0].text()).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim();const items=text?text.split(/\n\s*\n/).map(block=>{const lines=block.split('\n'),k=lines.findIndex(s=>s.includes('-->'));if(k<0)throw Error('SRT缺少时间行');const parts=lines[k].split('-->');if(parts.length!==2)throw Error('SRT时间行不合法');return {start:parseTime(parts[0]),end:parseTime(parts[1]),text:lines.slice(k+1).join('\n')}}):[];validate(items);cues=items;loopId=null;save();render()}catch(e){$('#error').textContent=e.message}};
$('#export').onclick=()=>{try{validate(cues);const text=cues.map((c,i)=>`${i+1}\n${stamp(c.start)} --> ${stamp(c.end)}\n${c.text.trim()}`).join('\n\n')+'\n';const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='captions-reviewed.srt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('#error').textContent=e.message}};
$('#restore').onclick=()=>{try{const s=localStorage.getItem(DRAFT);if(s){const items=JSON.parse(s);validate(items);cues=items;loopId=null;save();render()}}catch(e){$('#error').textContent=e.message}};
$('#reset').onclick=()=>{if(confirm('恢复初始字幕会替换当前页面修改，继续？')){cues=structuredClone(INITIAL);loopId=null;save();render()}};
video.onerror=()=>$('#error').textContent='视频未载入，请选择同时间轴的无字幕底片或校对代理。';$('#status').textContent=`已载入${cues.length}条字幕`;render();update();
</script></html>
